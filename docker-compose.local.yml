# MatTicket – Local (baut das Image aus diesem Ordner) mit pgAdmin
#   ./scripts/redeploy.ps1              (baut neu und startet den Stack: so wird jede Änderung getestet)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:2740
#   pgAdmin:  http://localhost:2741   (ohne Anmeldung; Datenbank-Passwort: matticket)
#   Postgres: localhost:2742          (für Tests und Werkzeuge)
name: matticket-local

services:
  web:
    build: .
    image: matticket:local
    restart: unless-stopped
    ports:
      - "2740:2740"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "2742:5432"
    environment:
      POSTGRES_DB: matticket
      POSTGRES_USER: matticket
      POSTGRES_PASSWORD: matticket
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matticket -d matticket"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "2741:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matticket.example.com
      PGADMIN_DEFAULT_PASSWORD: matticket
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatTicket (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matticket", "Username": "matticket", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# Ein festes Subnetz: auf einem Rechner mit vielen Stacks gehen Docker sonst die Adressbereiche aus
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.74.0/24
