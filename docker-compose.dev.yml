# MatTicket – Development (Branch dev, Image :nightly) mit pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:2740
#   pgAdmin: http://localhost:2741   (ohne Anmeldung; Datenbank-Passwort: matticket)
name: matticket-dev

services:
  web:
    image: ghcr.io/real-ttx/matticket:nightly
    restart: unless-stopped
    ports:
      - "2740:2740"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matticket
      POSTGRES_USER: matticket
      POSTGRES_PASSWORD: matticket
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matticket -d matticket"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "2741:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matticket.example.com
      PGADMIN_DEFAULT_PASSWORD: matticket
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatTicket", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matticket", "Username": "matticket", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
